[package]
name = "dectris_simplon"
description = "SIMPLON 1.8 REST client, state-machine policy, Python-free workers, monitor TIFF (DESIGN §4.1-§4.2, §3.4)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Exposes `dectris_simplon::testing` (the fake SIMPLON server) to other crates' tests:
#   [dev-dependencies] dectris_simplon = { workspace = true, features = ["test-util"] }
test-util = []

[dependencies]
dectris_common.workspace = true
log.workspace = true
ureq.workspace = true
serde.workspace = true
serde_json.workspace = true
tiff.workspace = true

[dev-dependencies]
dectris_simplon = { path = ".", features = ["test-util"] }
dectris_common = { workspace = true, features = ["test-util"] }
proptest.workspace = true

[lints]
workspace = true
